<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muskan Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090f; --bg2:#0d0e18; --bg3:#111220; --bg4:#161728;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.12);
  --text:#ddd8f0; --muted:#5e5a7a; --accent:#8b6ff5;
  --accent2:#c8a96e; --green:#5ae09a; --red:#e05a5a;
  --sidebar-w:220px; --panel-w:300px;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
#topbar{
  height:48px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0;flex-shrink:0;z-index:30;
}
#topbar .logo{padding:0 18px;font-size:14px;font-weight:600;color:#fff;letter-spacing:0.05em;border-right:1px solid var(--border);white-space:nowrap}
#topbar .logo span{color:var(--accent)}
#lvlLabel{padding:0 14px;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--border);height:100%;display:flex;align-items:center;min-width:160px}
.top-spacer{flex:1}
.top-btn{
  height:100%;padding:0 16px;border:none;background:transparent;color:var(--muted);
  font-family:inherit;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  cursor:pointer;transition:all 0.18s;border-left:1px solid var(--border);display:flex;align-items:center;gap:7px;
}
.top-btn:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.top-btn.accent{color:var(--accent);border-color:rgba(139,111,245,0.2)}
.top-btn.accent:hover{background:rgba(139,111,245,0.08)}
.top-btn.green{color:var(--green);border-color:rgba(90,224,154,0.2)}
.top-btn.green:hover{background:rgba(90,224,154,0.06)}

/* ── LAYOUT ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
}
.side-header{padding:14px 14px 10px;font-size:9.5px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted)}
#levelList{flex:1;overflow-y:auto;padding:4px 6px}
.lvl-item{
  display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:4px;
  cursor:pointer;transition:background 0.15s;border:1px solid transparent;margin-bottom:2px;
  position:relative;
}
.lvl-item:hover{background:rgba(255,255,255,0.04)}
.lvl-item.active{background:rgba(139,111,245,0.1);border-color:rgba(139,111,245,0.25)}
.lvl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lvl-name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl-theme{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)}
.lvl-actions{display:none;gap:3px}
.lvl-item:hover .lvl-actions{display:flex}
.icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:2px;transition:all 0.15s}
.icon-btn:hover{color:var(--text);background:rgba(255,255,255,0.08)}
.icon-btn.red:hover{color:var(--red)}
.lvl-hidden{opacity:0.38}
#addLvlBtn{
  margin:10px;padding:9px;border:1px dashed var(--border2);border-radius:4px;
  background:transparent;color:var(--muted);font-family:inherit;font-size:11px;
  letter-spacing:0.12em;cursor:pointer;transition:all 0.18s;text-transform:uppercase;
}
#addLvlBtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(139,111,245,0.05)}

/* ── EDITOR AREA ── */
#editorArea{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── PALETTE ── */
#palette{
  height:44px;background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;
}
.palette-lbl{font-size:9px;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.ptool{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:3px;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  font-family:inherit;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;transition:all 0.15s;
}
.ptool:hover{border-color:var(--border2);color:var(--text)}
.ptool.active{border-color:rgba(139,111,245,0.5);background:rgba(139,111,245,0.1);color:var(--accent)}
.ptool .dot{width:9px;height:9px;border-radius:2px}
.pal-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.zoom-controls{margin-left:auto;display:flex;align-items:center;gap:5px}
.zoom-btn{background:transparent;border:1px solid var(--border);border-radius:2px;color:var(--muted);font-size:12px;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.zoom-btn:hover{color:var(--text);border-color:var(--border2)}
#zoomLabel{font-size:10px;color:var(--muted);min-width:36px;text-align:center}

/* ── CANVAS SCROLL ── */
#editorScroll{flex:1;overflow:auto;position:relative;background:var(--bg);cursor:default}
#editorCanvas{display:block}
#editorScroll::-webkit-scrollbar{height:6px;width:6px}
#editorScroll::-webkit-scrollbar-track{background:var(--bg2)}
#editorScroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

/* ── RIGHT PANEL ── */
#rightPanel{
  width:var(--panel-w);flex-shrink:0;background:var(--bg2);
  border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
}
.panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ptab{
  flex:1;padding:11px;text-align:center;font-size:10px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;
  background:transparent;font-family:inherit;transition:all 0.15s;border-bottom:2px solid transparent;
}
.ptab:hover{color:var(--text)}
.ptab.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel-body{flex:1;overflow-y:auto;padding:16px}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.07);border-radius:2px}

/* ── PROPERTIES ── */
.prop-title{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.prop-section{margin-bottom:16px}
.prop-section-lbl{font-size:8.5px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.prop-row{margin-bottom:8px}
.prop-lbl{font-size:10px;color:var(--muted);margin-bottom:4px;display:block}
.prop-input{
  width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:3px;color:var(--text);font-family:inherit;font-size:12px;
  padding:6px 9px;transition:border 0.15s;
}
.prop-input:focus{outline:none;border-color:rgba(139,111,245,0.4)}
.prop-input::placeholder{color:var(--muted)}
.prop-select{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:3px;color:var(--text);font-family:inherit;font-size:12px;
  padding:6px 9px;cursor:pointer;
}
.prop-select:focus{outline:none;border-color:rgba(139,111,245,0.4)}
.prop-textarea{min-height:70px;resize:vertical;line-height:1.6}
.prop-cb-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prop-cb-row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.prop-cb-row label{font-size:11px;color:var(--text);cursor:pointer}
.save-btn{
  width:100%;padding:9px;background:rgba(139,111,245,0.12);border:1px solid rgba(139,111,245,0.3);
  border-radius:3px;color:var(--accent);font-family:inherit;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all 0.18s;margin-top:4px;
}
.save-btn:hover{background:rgba(139,111,245,0.22)}
.no-select-msg{color:var(--muted);font-size:11px;text-align:center;padding:30px 10px;line-height:1.7;font-family:'Crimson Text',serif;font-size:14px}
.del-btn{
  width:100%;padding:8px;background:rgba(224,90,90,0.08);border:1px solid rgba(224,90,90,0.22);
  border-radius:3px;color:var(--red);font-family:inherit;font-size:11px;
  letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all 0.18s;margin-top:6px;
}
.del-btn:hover{background:rgba(224,90,90,0.18)}
.prop-saved{font-size:10px;color:var(--green);letter-spacing:0.15em;display:none;margin-top:5px;text-align:center}
.prop-saved.on{display:block}

/* ── LEVEL SETTINGS ── */
#lvlSettings{margin-bottom:18px}

/* ── INBOX PANEL ── */
.ibx-empty{color:var(--muted);font-family:'Crimson Text',serif;font-size:14px;text-align:center;padding:28px 10px;line-height:1.7}
.ibx-item{border-bottom:1px solid var(--border);padding:12px 0}
.ibx-item:last-child{border-bottom:none}
.ibx-item-from{font-size:8.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent2);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.ibx-item-body{font-family:'Crimson Text',serif;font-size:13px;color:var(--text);line-height:1.7;white-space:pre-line;margin-bottom:7px}
.ibx-item-meta{font-size:10px;color:var(--muted)}
.ibx-new-badge{background:var(--red);border-radius:2px;padding:1px 5px;font-size:8px}
.reply-area{
  width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:3px;color:var(--text);font-family:'Crimson Text',serif;font-size:12px;
  padding:7px 9px;resize:vertical;min-height:50px;margin-top:6px;
}
.reply-area::placeholder{color:var(--muted)}
.reply-area:focus{outline:none;border-color:rgba(200,169,110,0.35)}
.reply-btn{
  padding:5px 12px;background:rgba(200,169,110,0.1);border:1px solid rgba(200,169,110,0.3);
  border-radius:2px;color:var(--accent2);font-family:inherit;font-size:10px;
  letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all 0.15s;margin-top:5px;
}
.reply-btn:hover{background:rgba(200,169,110,0.2)}
.mark-btn{
  padding:4px 9px;background:transparent;border:1px solid var(--border);
  border-radius:2px;color:var(--muted);font-family:inherit;font-size:9px;cursor:pointer;transition:all 0.15s;
}
.mark-btn:hover{color:var(--text);border-color:var(--border2)}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--bg4);border:1px solid var(--border2);border-radius:4px;
  padding:10px 20px;font-size:11px;letter-spacing:0.14em;color:var(--green);
  z-index:999;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.7);
}
#toast.on{display:block;animation:fadeUp 0.3s ease}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-box{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:28px 32px;width:min(360px,90vw);box-shadow:0 16px 60px rgba(0,0,0,0.8)}
.modal-box h3{font-size:15px;color:var(--text);margin-bottom:16px}
.modal-box .prop-row{margin-bottom:10px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .save-btn{flex:1}
.modal-cancel{flex:1;padding:9px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all 0.18s}
.modal-cancel:hover{color:var(--text);border-color:var(--border2)}

@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}

/* ── ONBOARDING EDITOR ── */
.ob-seq-card{
  border:1px solid var(--border);border-radius:4px;padding:11px 13px;margin-bottom:9px;
  background:rgba(255,255,255,0.02);cursor:pointer;transition:background 0.15s;
}
.ob-seq-card:hover{background:rgba(255,255,255,0.04)}
.ob-seq-card.active{border-color:rgba(139,111,245,0.4);background:rgba(139,111,245,0.06)}
.ob-seq-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px}
.ob-seq-meta{font-size:9.5px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase}
.ob-slide-card{
  border:1px solid var(--border);border-radius:3px;padding:9px 11px;margin-bottom:7px;
  background:rgba(255,255,255,0.015);display:flex;align-items:center;gap:8px;
}
.ob-slide-num{width:22px;height:22px;border-radius:50%;background:rgba(139,111,245,0.15);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--accent);flex-shrink:0}
.ob-slide-info{flex:1;min-width:0}
.ob-slide-title{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-slide-sub{font-size:9px;color:var(--muted)}
.ob-slide-actions{display:flex;gap:3px;flex-shrink:0}
.ob-add-slide{
  width:100%;padding:8px;border:1px dashed var(--border2);border-radius:3px;
  background:transparent;color:var(--muted);font-family:inherit;font-size:10px;
  letter-spacing:0.1em;cursor:pointer;transition:all 0.15s;text-transform:uppercase;
  margin-top:6px;
}
.ob-add-slide:hover{border-color:var(--accent);color:var(--accent);background:rgba(139,111,245,0.05)}
.ob-trigger-badge{
  display:inline-block;padding:2px 7px;border-radius:10px;font-size:8.5px;
  letter-spacing:0.12em;text-transform:uppercase;font-weight:500;
}
.ob-trigger-badge.before{background:rgba(90,224,154,0.12);color:var(--green);border:1px solid rgba(90,224,154,0.25)}
.ob-trigger-badge.after{background:rgba(200,169,110,0.12);color:var(--accent2);border:1px solid rgba(200,169,110,0.25)}
.ob-empty{color:var(--muted);font-family:'Crimson Text',serif;font-size:14px;text-align:center;padding:28px 10px;line-height:1.7}
.ob-img-preview{max-width:100%;max-height:120px;border-radius:3px;margin-top:6px;border:1px solid var(--border)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">Muskan <span>Dashboard</span></div>
  <div id="lvlLabel">No level selected</div>
  <div class="top-spacer"></div>
  <button class="top-btn" id="previewBtn">▶ Preview</button>
  <button class="top-btn green" id="publishBtn">↑ Publish</button>
  <button class="top-btn accent" id="openGameBtn">Open Game ↗</button>
</div>

<div id="main">
  <!-- SIDEBAR: Level List -->
  <div id="sidebar">
    <div class="side-header">Levels</div>
    <div id="levelList"></div>
    <button id="addLvlBtn">+ New Level</button>
  </div>

  <!-- CENTER: Editor -->
  <div id="editorArea">
    <!-- Palette -->
    <div id="palette">
      <span class="palette-lbl">Tool</span>
      <button class="ptool active" data-tool="select" id="toolSelect">
        <span class="dot" style="background:#5a6a8a;border-radius:50%"></span> Select
      </button>
      <button class="ptool" data-tool="ground" id="toolGround">
        <span class="dot" style="background:#3d6020"></span> Ground
      </button>
      <button class="ptool" data-tool="decoration" id="toolDeco">
        <span class="dot" style="background:#3a2a14"></span> Deco
      </button>
      <button class="ptool" data-tool="message" id="toolMsg">
        <span class="dot" style="background:#60c0ff;border-radius:50%"></span> Message
      </button>
      <button class="ptool" data-tool="image" id="toolImg">
        <span class="dot" style="background:#ffc060;transform:rotate(45deg)"></span> Image
      </button>
      <button class="ptool" data-tool="exit" id="toolExit">
        <span class="dot" style="background:#a060ff;border-radius:50%"></span> Exit
      </button>
      <button class="ptool" data-tool="block" id="toolBlock">
        <span class="dot" style="background:#8a6a4a"></span> Block
      </button>
      <div class="pal-sep"></div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOut">−</button>
        <span id="zoomLabel">25%</span>
        <button class="zoom-btn" id="zoomIn">+</button>
      </div>
    </div>

    <!-- Canvas -->
    <div id="editorScroll">
      <canvas id="editorCanvas"></canvas>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="rightPanel">
    <div class="panel-tabs">
      <button class="ptab active" data-tab="props">Properties</button>
      <button class="ptab" data-tab="inbox" id="inboxTab">Inbox <span id="inboxBadge" style="display:none;background:#e05a5a;border-radius:2px;padding:1px 5px;font-size:8px;margin-left:4px">!</span></button>
      <button class="ptab" data-tab="profiles" id="profilesTab">Profiles</button>
      <button class="ptab" data-tab="onboarding" id="onboardingTab">Onboard</button>
    </div>
    <div class="panel-body" id="propsBody"></div>
    <div class="panel-body" id="inboxBody" style="display:none"></div>
    <div class="panel-body" id="profilesBody" style="display:none"></div>
    <div class="panel-body" id="onboardingBody" style="display:none"></div>
  </div>
</div>

<!-- Onboarding Modals -->
<!-- Add Sequence Modal -->
<div class="modal-overlay" id="addObSeqModal">
  <div class="modal-box">
    <h3>New Onboarding Sequence</h3>
    <div class="prop-row"><label class="prop-lbl">Name</label><input class="prop-input" id="newObSeqName" placeholder="e.g. Intro Tutorial"></div>
    <div class="prop-row"><label class="prop-lbl">Trigger Event</label>
      <select class="prop-select" id="newObSeqTrigger">
        <option value="start_game">Start of Game (New Save)</option>
        <option value="before_level">Before Level Starts</option>
        <option value="after_level">After Level Ends</option>
      </select>
    </div>
    <div class="prop-row" id="newObSeqLvlRow" style="display:none"><label class="prop-lbl">Target Level</label>
      <select class="prop-select" id="newObSeqLvl"></select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" id="obSeqCancelBtn">Cancel</button>
      <button class="save-btn" id="obSeqSaveBtn">Create</button>
    </div>
  </div>
</div>

<!-- Edit Slide Modal -->
<div class="modal-overlay" id="editObSlideModal">
  <div class="modal-box">
    <h3>Edit Slide</h3>
    <div class="prop-row"><label class="prop-lbl">Text Content</label>
      <textarea class="prop-input" id="obSlideText" rows="4" placeholder="Enter slide text..." style="resize:vertical"></textarea>
    </div>
    <div class="prop-row"><label class="prop-lbl">Image (Optional)</label>
      <div style="display:flex;gap:8px;align-items:center;width:100%">
        <input type="file" id="obSlideImgFile" accept="image/png, image/jpeg, image/webp" style="font-size:10px;width:100%">
        <button class="del-btn" id="obSlideImgClear" style="width:auto;padding:5px 10px;margin:0" title="Remove image">✕</button>
      </div>
      <div id="obSlideImgPreviewContainer" style="display:none;margin-top:8px">
        <img id="obSlideImgPreview" class="ob-img-preview" src="">
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" id="obSlideCancelBtn">Cancel</button>
      <button class="save-btn" id="obSlideSaveBtn">Save Slide</button>
    </div>
  </div>
</div>

<!-- Add Level Modal -->
<div class="modal-overlay" id="addLvlModal">
  <div class="modal-box">
    <h3>New Level</h3>
    <div class="prop-row"><label class="prop-lbl">Title</label><input class="prop-input" id="newLvlTitle" placeholder="Level title"></div>
    <div class="prop-row"><label class="prop-lbl">Theme</label>
      <select class="prop-select" id="newLvlTheme">
        <option value="forest">Forest</option><option value="space">Space</option><option value="bedroom">Bedroom</option><option value="city">City</option><option value="ocean">Ocean</option>
        <option value="vanilla_sky">Vanilla Sky</option><option value="rose_garden">Rose Garden</option><option value="lavender_fields">Lavender Fields</option><option value="peach_blossom">Peach Blossom</option>
        <option value="bathroom_mirror">Bathroom Mirror</option><option value="balcony_at_dusk">Balcony At Dusk</option><option value="under_the_quilt">Under The Quilt</option><option value="dressing_table">Dressing Table</option>

<script>
'use strict';
// ════════════════════════════════════════════════════════════
// CONFIG — same as game.html
// ════════════════════════════════════════════════════════════
const CONFIG = {
  API_BASE: '', // e.g. 'https://api.example.com'
  EP: {
    levels:      () => `${CONFIG.API_BASE}/levels`,
    level:      id => `${CONFIG.API_BASE}/level/${id}`,
    postLevel:   () => `${CONFIG.API_BASE}/level`,
    putLevel:   id => `${CONFIG.API_BASE}/level/${id}`,
    getMsgs:     () => `${CONFIG.API_BASE}/messages`,
    postMsg:     () => `${CONFIG.API_BASE}/message`,
  }
};

// ════════════════════════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════════════════════════
const S = {
  get(k,fb=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  async api(url,opts={}){
    if(!CONFIG.API_BASE) return null;
    try{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw new Error(r.status);return await r.json();}
    catch(e){console.warn('[Dashboard] API unavailable →',e.message);return null;}
  },
  // 🔌 GET /levels
  async getLevels(){const r=await this.api(CONFIG.EP.levels());return r||this.get('muskan_levels');},
  // 🔌 PUT /level/:id or POST /level
  async saveLevel(lv){
    const all=this.get('muskan_levels',[])||[];
    const idx=all.findIndex(l=>l.id===lv.id);
    if(idx>=0) all[idx]=lv; else all.push(lv);
    this.set('muskan_levels',all);
    // 🔌 API HOOK
    if(idx>=0) await this.api(CONFIG.EP.putLevel(lv.id),{method:'PUT',body:JSON.stringify(lv)});
    else await this.api(CONFIG.EP.postLevel(),{method:'POST',body:JSON.stringify(lv)});
  },
  async saveLevels(lvs){
    this.set('muskan_levels',lvs);
    // 🔌 API HOOK: batch save — POST each changed level
    for(const lv of lvs) await this.api(CONFIG.EP.putLevel(lv.id),{method:'PUT',body:JSON.stringify(lv)});
  },
  async getMsgs(){
    const r=await this.api(CONFIG.EP.getMsgs());
    if(r) return r;
    return this.get('muskan_messages',[]);
  },
  async replyMsg(msgId,replyText,playerId){
    const all=this.get('muskan_messages',[]);
    const orig=all.find(m=>m.messageId===msgId);
    const reply={
      messageId:'reply_'+Date.now(),
      playerId:orig?orig.playerId:playerId,
      levelId:orig?orig.levelId:'',
      fromPlayer:false,
      content:replyText,
      timestamp:new Date().toISOString(),
      isRead:false,
    };
    all.push(reply);
    this.set('muskan_messages',all);
    // 🔌 API HOOK: POST /message
    await this.api(CONFIG.EP.postMsg(),{method:'POST',body:JSON.stringify(reply)});
  },
  markRead(msgId){
    const all=this.get('muskan_messages',[]);
    const m=all.find(m=>m.messageId===msgId); if(m) m.isRead=true;
    this.set('muskan_messages',all);
  },
  getProfiles(){
    let profs = this.get('muskan_profiles', null);
    if(!profs){
      const active = this.get('muskan_player', null);
      if(active && active.playerId){
        profs = [{ ...active, name: active.name || 'Player 1' }];
      } else {
        profs = [{ playerId: 'player_' + Date.now(), name: 'Explorer 1', shape: 'circle', color: '#c8a96e', currentLevelId: 'level1', highestLevelIndex: 0, lastPositionX: 200, messagesRead: [], savedMemories: [] }];
      }
      this.set('muskan_profiles', profs);
    }
    return profs;
  },
  saveProfiles(profs){ this.set('muskan_profiles', profs); },
  setActiveProfile(p){ this.set('muskan_player', p); },
};

// ════════════════════════════════════════════════════════════
// APP STATE
// ════════════════════════════════════════════════════════════
let levels = [];
let curLvlId = null;
let selElId = null;  // selected element ID
let curTool = 'select';
let zoom = 0.25;
let editorDragging = false;
let dragOffX = 0;
let dragOffY = 0;
let dragStartX = 0;
let activeTab = 'props';

const EDITOR_H = 420; // canvas height in pixels

// ════════════════════════════════════════════════════════════
// CANVAS SETUP
// ════════════════════════════════════════════════════════════
const ec = document.getElementById('editorCanvas');
const ex = ec.getContext('2d');

function curLv(){ return levels.find(l=>l.id===curLvlId)||null; }
function canvasW(){ const lv=curLv(); return lv?Math.max(lv.worldWidth*zoom,800):800; }

function resizeCanvas(){
  const lv=curLv();
  ec.width=lv?Math.max(lv.worldWidth*zoom,window.innerWidth-var_sidebar_w()-var_panel_w()):800;
  ec.height=EDITOR_H;
  renderEditor();
}
function var_sidebar_w(){return 220;}
function var_panel_w(){return 300;}

// ════════════════════════════════════════════════════════════
// EDITOR RENDERING
// ════════════════════════════════════════════════════════════
const GROUND_Y_FRAC = 0.72; // ground as fraction of editor height

function renderEditor(){
  const lv=curLv();
  const W=ec.width, H=ec.height;
  const GY=H*GROUND_Y_FRAC;
  ex.clearRect(0,0,W,H);

  if(!lv){
    ex.fillStyle='#0d0e18';ex.fillRect(0,0,W,H);
    ex.fillStyle='#2a2840';ex.font='13px "Space Grotesk",sans-serif';ex.textAlign='center';
    ex.fillText('Select or create a level to begin',W/2,H/2);
    return;
  }

  const th=TC[lv.theme]||TC.forest;

  // Sky
  const sky=ex.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,th.sky); sky.addColorStop(1,mix(th.sky,'#111',0.5));
  ex.fillStyle=sky; ex.fillRect(0,0,W,GY);

  // Grid
  const gridStep=80*zoom;
  ex.strokeStyle='rgba(255,255,255,0.04)'; ex.lineWidth=0.5;
  for(let gx=0;gx<W;gx+=gridStep){ ex.beginPath();ex.moveTo(gx,0);ex.lineTo(gx,H);ex.stroke(); }
  for(let gy=0;gy<H;gy+=gridStep){ ex.beginPath();ex.moveTo(0,gy);ex.lineTo(W,gy);ex.stroke(); }

  // Ground
  const grg=ex.createLinearGradient(0,GY,0,H);
  grg.addColorStop(0,th.grd); grg.addColorStop(1,mix(th.grd,'#000',0.6));
  ex.fillStyle=grg; ex.fillRect(0,GY,W,H-GY);
  ex.strokeStyle='rgba(255,255,255,0.1)'; ex.lineWidth=1;
  ex.beginPath();ex.moveTo(0,GY);ex.lineTo(W,GY);ex.stroke();

  // World width boundary
  const wBound=lv.worldWidth*zoom;
  ex.strokeStyle='rgba(200,100,100,0.35)'; ex.lineWidth=1.5; ex.setLineDash([5,5]);
  ex.beginPath();ex.moveTo(wBound,0);ex.lineTo(wBound,H);ex.stroke();
  ex.setLineDash([]);
  ex.fillStyle='rgba(200,100,100,0.5)';ex.font='9px "Space Grotesk",sans-serif';ex.textAlign='left';
  ex.fillText('world end',wBound+4,14);

  // Draw elements
  lv.elements.forEach(el=>{
    const ex2=el.x*zoom;
    if(ex2<-80||ex2>W+80) return;
    const isSel=el.id===selElId;
    drawEditorEl(el,ex2,GY,isSel);
  });

  // Ruler numbers at top
  ex.fillStyle='rgba(255,255,255,0.2)';ex.font='8px monospace';ex.textAlign='center';
  for(let wx=0;wx<=lv.worldWidth;wx+=400){
    const sx=wx*zoom;
    ex.fillText(wx,sx,10);
    ex.strokeStyle='rgba(255,255,255,0.06)';ex.lineWidth=0.5;
    ex.beginPath();ex.moveTo(sx,0);ex.lineTo(sx,H);ex.stroke();
  }
}

function drawEditorEl(el,sx,GY_base,selected){
  const sel=selected;
  const GY = GY_base + (el.y || 0);
  ex.save();
  switch(el.type){
    case 'ground': {
      ex.fillStyle=sel?'rgba(90,224,154,0.4)':'rgba(60,180,100,0.25)';
      ex.strokeStyle=sel?'#5ae09a':'rgba(60,180,100,0.5)';
      ex.lineWidth=1; ex.fillRect(sx-40,GY,80,12); ex.strokeRect(sx-40,GY,80,12);
      edLabel(sx,GY+6,'ground',el); break;
    }
    case 'decoration': {
      ex.fillStyle=sel?'rgba(100,80,50,0.6)':'rgba(80,60,30,0.45)';
      ex.strokeStyle=sel?'#c8a96e':'rgba(180,140,80,0.45)';
      ex.lineWidth=1; ex.fillRect(sx-18,GY-30,36,30); ex.strokeRect(sx-18,GY-30,36,30);
      edLabel(sx,GY-14,el.variant||'deco',el); break;
    }
    case 'message': {
      const r=9+Math.sin(Date.now()/700+el.x*0.01)*2;
      ex.shadowBlur=sel?16:8; ex.shadowColor=el.isSecret?'#9060ff':'#60c0ff';
      ex.fillStyle=el.isSecret?'rgba(140,80,255,0.85)':'rgba(80,190,255,0.85)';
      ex.beginPath();ex.arc(sx,GY-28,r,0,Math.PI*2);ex.fill();ex.shadowBlur=0;
      edLabel(sx,GY-14,el.isSecret?'secret':'msg',el); break;
    }
    case 'image': {
      const r=9;
      ex.shadowBlur=sel?16:8; ex.shadowColor='#ffc060';
      ex.fillStyle='rgba(255,192,80,0.85)';
      ex.beginPath();ex.moveTo(sx,GY-38);ex.lineTo(sx+r,GY-28);ex.lineTo(sx,GY-18);ex.lineTo(sx-r,GY-28);ex.closePath();ex.fill();
      ex.shadowBlur=0; edLabel(sx,GY-14,'img',el); break;
    }
    case 'exit': {
      ex.shadowBlur=sel?20:12; ex.shadowColor='#a060ff';
      ex.strokeStyle=sel?'#c080ff':'rgba(160,96,255,0.75)';
      ex.lineWidth=2;
      ex.beginPath();ex.moveTo(sx,GY);ex.lineTo(sx,GY-38);
      ex.arc(sx+20,GY-38,20,Math.PI,0);ex.lineTo(sx+40,GY);ex.stroke();
      ex.fillStyle=sel?'rgba(120,60,255,0.35)':'rgba(100,50,200,0.2)';
      ex.beginPath();ex.moveTo(sx+1,GY);ex.lineTo(sx+1,GY-38);
      ex.arc(sx+20,GY-38,19,Math.PI,0);ex.lineTo(sx+39,GY);ex.closePath();ex.fill();
      ex.shadowBlur=0; edLabel(sx+20,GY-14,'exit',el); break;
    }
    case 'block': {
      const w=(el.w||70)*zoom, h=(el.h||45)*zoom;
      ex.fillStyle=sel?'rgba(180,120,70,0.85)':(el.color||'rgba(100,70,40,0.65)');
      ex.strokeStyle=sel?'#ffc080':'rgba(200,140,90,0.5)';
      ex.lineWidth=1;
      ex.fillRect(sx-w/2,GY-h,w,h);
      ex.strokeRect(sx-w/2,GY-h,w,h);
      edLabel(sx,GY-h/2,'block',el); break;
    }
  }
  // Selection ring
  if(selected){
    ex.strokeStyle='#fff'; ex.lineWidth=1.5; ex.setLineDash([3,3]);
    ex.strokeRect(sx-24,GY-44,48,50); ex.setLineDash([]);
  }
  ex.restore();
}

function edLabel(sx,sy,text,el){
  ex.fillStyle='rgba(255,255,255,0.45)';ex.font='7px "Space Grotesk",sans-serif';ex.textAlign='center';
  ex.fillText(text.slice(0,8).toUpperCase(),sx,sy);
  ex.fillStyle='rgba(255,255,255,0.2)';ex.fillText('x:'+Math.round(el.x)+', y:'+Math.round(el.y||0),sx,sy+8);
}

function mix(c1,c2,t){
  const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16)||0,g2=parseInt(c2.slice(3,5),16)||0,b2=parseInt(c2.slice(5,7),16)||0;
  return `rgb(${r1+(r2-r1)*t|0},${g1+(g2-g1)*t|0},${b1+(b2-b1)*t|0})`;
}

// Animate editor (node pulse)
setInterval(()=>{ if(curLv()) renderEditor(); }, 80);

// ════════════════════════════════════════════════════════════
// EDITOR MOUSE EVENTS
// ════════════════════════════════════════════════════════════
ec.addEventListener('mousedown', e => {
  const lv=curLv(); if(!lv) return;
  const scrollEl=document.getElementById('editorScroll');
  const rect=ec.getBoundingClientRect();
  const mx=e.clientX-rect.left+scrollEl.scrollLeft;
  const wx=mx/zoom; // world X
  const GY=ec.height*GROUND_Y_FRAC;
  const sy=e.clientY-rect.top;

  if(curTool==='select'){
    // Find clicked element
    const clicked=findElAt(lv,wx,sy,GY);
    if(clicked){
      selElId=clicked.id; editorDragging=true; dragOffX=wx-clicked.x; dragOffY=sy-(GY+(clicked.y||0)); dragStartX=clicked.x;
      renderProps(); renderEditor();
    } else { selElId=null; renderProps(); }
  } else {
    // Place new element
    const newEl=makeEl(curTool, Math.round(wx/80)*80);
    lv.elements.push(newEl);
    selElId=newEl.id; S.saveLevel(lv); renderProps(); renderEditor();
  }
});

ec.addEventListener('mousemove', e => {
  if(!editorDragging||selElId===null) return;
  const lv=curLv(); if(!lv) return;
  const scrollEl=document.getElementById('editorScroll');
  const rect=ec.getBoundingClientRect();
  const mx=e.clientX-rect.left+scrollEl.scrollLeft;
  const wx=mx/zoom;
  const GY=ec.height*GROUND_Y_FRAC;
  const sy=e.clientY-rect.top;
  const el=lv.elements.find(e2=>e2.id===selElId); if(!el) return;
  el.x=Math.max(0,Math.round((wx-dragOffX)/40)*40);
  el.y=Math.round((sy-GY-dragOffY)/20)*20; // 20px snap on Y
  document.getElementById('propX') && (document.getElementById('propX').value=el.x);
  document.getElementById('propY') && (document.getElementById('propY').value=el.y);
  renderEditor();
});

ec.addEventListener('mouseup', () => {
  if(editorDragging && selElId){
    const lv=curLv(); if(lv) S.saveLevel(lv);
  }
  editorDragging=false;
});

ec.addEventListener('mouseleave', ()=>{
  if(editorDragging && selElId){ const lv=curLv(); if(lv) S.saveLevel(lv); }
  editorDragging=false;
});

function findElAt(lv,wx,sy,GY){
  // Find element closest to click world x within tolerance, considering y
  let best=null, bestDist=60;
  lv.elements.forEach(el=>{
    const elY = GY + (el.y||0);
    const dist=Math.abs(el.x-wx) + Math.abs(elY - 20 - sy); // rough distance
    if(dist<bestDist+40 && Math.abs(el.x-wx)<60 && Math.abs(elY-20-sy)<60){ best=el; bestDist=dist; }
  });
  return best;
}

let elIdCounter = 1000;
function makeEl(type, wx){
  const base={id:'el_'+Date.now()+'_'+(elIdCounter++), type, x:wx, y:0};
  if(type==='message') return {...base, title:'New message', content:'Your text here...'};
  if(type==='decoration') return {...base, variant:'tree', scale:1};
  if(type==='image') return {...base, imageType:'book', title:'An image:', content:'Caption here.'};
  if(type==='exit') return {...base, nextLevelId:null};
  if(type==='block') return {...base, w:70, h:45, color:'#3d2e1f'};
  if(type==='ground') return {...base};
  return base;
}

function renderLevelList(){
  const el=document.getElementById('levelList');
  el.innerHTML='';
  levels.forEach(lv=>{
    const th=TC[lv.theme]||TC.forest;
    const div=document.createElement('div');
    div.className='lvl-item'+(lv.id===curLvlId?' active':'')+(lv.isVisible?'':' lvl-hidden');
    div.innerHTML=`
      <div class="lvl-dot" style="background:${th.dot}"></div>
      <div>
        <div class="lvl-name">${esc(lv.title)}</div>
        <div class="lvl-theme">${lv.theme}</div>
      </div>
      <div class="lvl-actions">
        <button class="icon-btn" title="Toggle visibility" data-id="${lv.id}" data-act="vis">${lv.isVisible?'●':'○'}</button>
        <button class="icon-btn" title="Move up" data-id="${lv.id}" data-act="up">↑</button>
        <button class="icon-btn" title="Move down" data-id="${lv.id}" data-act="dn">↓</button>
        <button class="icon-btn red" title="Delete" data-id="${lv.id}" data-act="del">✕</button>
      </div>`;
    div.addEventListener('click',e=>{
      const btn=e.target.closest('[data-act]');
      if(btn){e.stopPropagation();handleLvlAction(btn.dataset.id,btn.dataset.act);return;}
      selectLevel(lv.id);
    });
    el.appendChild(div);
  });
}

function handleLvlAction(id, act){
  const idx=levels.findIndex(l=>l.id===id);
  if(idx<0) return;
  if(act==='vis'){ levels[idx].isVisible=!levels[idx].isVisible; }
  else if(act==='up' && idx>0){ [levels[idx],levels[idx-1]]=[levels[idx-1],levels[idx]]; }
  else if(act==='dn' && idx<levels.length-1){ [levels[idx],levels[idx+1]]=[levels[idx+1],levels[idx]]; }
  else if(act==='del'){
    if(!confirm(`Delete "${levels[idx].title}"?`)) return;
    levels.splice(idx,1);
    if(curLvlId===id){curLvlId=levels[0]?.id||null;selElId=null;}
  }
  levels.forEach((l,i)=>l.index=i);
  S.set('muskan_levels',levels);
  renderLevelList(); renderProps(); renderEditor();
}

function selectLevel(id){
  curLvlId=id; selElId=null;
  const lv=curLv();
  document.getElementById('lvlLabel').textContent=lv?lv.title:'No level';
  renderLevelList(); renderProps(); resizeCanvas();
}

function renderProps(){

  const lv=curLv();

  const el=lv.elements.find(e=>e.id===selElId);

  let html=`
    <div id="lvlSettings">
      <div class="prop-title">Level Settings</div>
      <div class="prop-row"><label class="prop-lbl">Title</label>

      <div class="prop-row"><label class="prop-lbl">Theme</label>
        <select class="prop-select" id="propLvlTheme">
          ${['forest','space','bedroom','city','ocean',
             'vanilla_sky','rose_garden','lavender_fields','peach_blossom',
             'bathroom_mirror','balcony_at_dusk','under_the_quilt','dressing_table',
             'ammas_kitchen','first_rains','late_night_call','unsent_drafts',
             'braid_day','jhumka_hunt','mango_stains','dance_practice',
             'special'].map(t=>`<option value="${t}"${lv.theme===t?' selected':''}>${t.replace(/_/g, ' ').replace(/\b\w/g, c=>c.toUpperCase())}</option>`).join('')}
        </select></div>
      ${lv.theme === 'special' ? `<div class="prop-row"><label class="prop-lbl">Special Text</label><input class="prop-input" id="propLvlSpecial" value="${esc(lv.specialText||'MUSKAN')}"></div>` : ''}
      <div class="prop-row"><label class="prop-lbl">World Width</label>
        <input class="prop-input" id="propLvlWidth" type="number" value="${lv.worldWidth}" min="800" max="10000" step="100"></div>
      <div class="prop-cb-row">
        <input type="checkbox" id="propLvlVisible" ${lv.isVisible?'checked':''}>
        <label for="propLvlVisible">Visible to players</label>
      </div>
      <button class="save-btn" id="saveLvlBtn">Save Level</button>
      <div class="prop-saved" id="lvlSaved">Saved ✓</div>
    </div>`;

  if(el){
    html+=`<div class="prop-section"><div class="prop-section-lbl">Selected Element — ${el.type}</div>`;
    html+=`<div class="prop-row"><label class="prop-lbl">World X</label><input class="prop-input" id="propX" type="number" value="${el.x}" step="40"></div>`;
    html+=`<div class="prop-row"><label class="prop-lbl">World Y (0=ground)</label><input class="prop-input" id="propY" type="number" value="${el.y||0}" step="20"></div>`;

    if(el.type==='decoration'){
      html+=`<div class="prop-row"><label class="prop-lbl">Variant</label>
        <select class="prop-select" id="propVariant">
          ${['tree','mushroom','bush','stone','planet','asteroid','bookshelf','lamp','bed','desk','building','streetlight','bench','coral','seaweed']
            .map(v=>`<option value="${v}"${el.variant===v?' selected':''}>${v}</option>`).join('')}
        </select></div>`;
      html+=`<div class="prop-row"><label class="prop-lbl">Color (optional)</label><input class="prop-input" id="propColor" value="${el.color||''}" placeholder="#3a1a6e"></div>`;
    }
    if(el.type==='block'){
      html+=`<div class="prop-row"><label class="prop-lbl">Width (px)</label><input class="prop-input" id="propWidth" type="number" value="${el.w||70}" step="5"></div>`;
      html+=`<div class="prop-row"><label class="prop-lbl">Height (px)</label><input class="prop-input" id="propHeight" type="number" value="${el.h||45}" step="5"></div>`;
      html+=`<div class="prop-row"><label class="prop-lbl">Color</label><input class="prop-input" id="propColor" value="${el.color||'#3d2e1f'}"></div>`;
    }
    if(el.type==='message'||el.type==='image'){
      html+=`<div class="prop-row"><label class="prop-lbl">Title / Label</label><input class="prop-input" id="propTitle" value="${esc(el.title||'')}"></div>`;
      html+=`<div class="prop-row"><label class="prop-lbl">Content / Caption</label><textarea class="prop-input prop-textarea" id="propContent">${esc(el.content||'')}</textarea></div>`;
    }
    if(el.type==='image'){
      html+=`<div class="prop-row"><label class="prop-lbl">Preset Icon</label>
        <select class="prop-select" id="propImgType">
          <option value="book"${el.imageType==='book'?' selected':''}>Book</option>
          <option value="creature"${el.imageType==='creature'?' selected':''}>Creature</option>
        </select></div>`;
      html+=`<div class="prop-row"><label class="prop-lbl">Upload Custom Image File</label><input type="file" id="propImgFile" accept="image/*" class="prop-input" style="padding:4px"></div>`;
      if(el.imageUrl){
        html+=`<div style="margin-top:6px;text-align:center;"><img src="${el.imageUrl}" style="max-width:100%;max-height:110px;border-radius:3px;border:1px solid var(--border);"/><br><button class="del-btn" id="clearImgBtn" style="padding:4px;font-size:9px;margin-top:4px">Remove Uploaded Image</button></div>`;
      }
    }
    if(el.type==='exit'){
      html+=`<div class="prop-row"><label class="prop-lbl">Next Level ID</label>
        <select class="prop-select" id="propNext">
          <option value="">— End of game —</option>
          ${levels.filter(l=>l.id!==curLvlId).map(l=>`<option value="${l.id}"${el.nextLevelId===l.id?' selected':''}>${esc(l.title)}</option>`).join('')}
        </select></div>`;
    }
    html+=`<div class="prop-cb-row"><input type="checkbox" id="propSecret" ${el.isSecret?'checked':''}><label for="propSecret">Secret element</label></div>`;
    html+=`<button class="save-btn" id="saveElBtn">Apply Changes</button>`;
    html+=`<div class="prop-saved" id="elSaved">Applied ✓</div>`;
    html+=`<button class="del-btn" id="delElBtn">Delete Element</button>`;
    html+=`</div>`;
  } else {
    html+=`<div class="no-select-msg">Click an element on the canvas to edit it, or use a tool to place new ones.</div>`;
  }

  body.innerHTML=html;

  // Level setting listeners
  document.getElementById('saveLvlBtn').addEventListener('click',()=>{
    lv.title=document.getElementById('propLvlTitle').value.trim()||lv.title;
    lv.theme=document.getElementById('propLvlTheme').value;
    lv.worldWidth=parseInt(document.getElementById('propLvlWidth').value)||lv.worldWidth;
    lv.isVisible=document.getElementById('propLvlVisible').checked;
    const specialInput = document.getElementById('propLvlSpecial');
    if (specialInput) lv.specialText = specialInput.value.trim();
    S.saveLevel(lv);
    document.getElementById('lvlLabel').textContent=lv.title;
    const saved=document.getElementById('lvlSaved'); saved.classList.add('on'); setTimeout(()=>saved.classList.remove('on'),2000);
    renderLevelList(); resizeCanvas();
  });
  
  document.getElementById('propLvlTheme').addEventListener('change', (e) => {
    lv.theme = e.target.value;
    renderProps(); // re-render to show/hide Special Text input
  });

  // Element listeners
  if(el){
    document.getElementById('saveElBtn').addEventListener('click',()=>{
      el.x=parseInt(document.getElementById('propX').value)||el.x;
      if(el.type==='decoration'){ el.variant=document.getElementById('propVariant').value; const c=document.getElementById('propColor').value; if(c) el.color=c; }
      if(el.type==='block'){ el.w=parseInt(document.getElementById('propWidth').value)||70; el.h=parseInt(document.getElementById('propHeight').value)||45; const c=document.getElementById('propColor').value; if(c) el.color=c; }
      if(el.type==='message'||el.type==='image'){ el.title=document.getElementById('propTitle').value; el.content=document.getElementById('propContent').value; }
      if(el.type==='image') el.imageType=document.getElementById('propImgType').value;
      if(el.type==='exit'){ const nxt=document.getElementById('propNext').value; el.nextLevelId=nxt||null; }
      el.isSecret=document.getElementById('propSecret').checked;
      S.saveLevel(lv);
      const saved=document.getElementById('elSaved'); saved.classList.add('on'); setTimeout(()=>saved.classList.remove('on'),2000);
      renderEditor();
    });

    if(el.type==='image'){
      const fileInput = document.getElementById('propImgFile');
      if(fileInput){
        fileInput.addEventListener('change', e=>{
          const file = e.target.files[0];
          if(file){
            const reader = new FileReader();
            reader.onload = function(evt){
              el.imageUrl = evt.target.result;
              S.saveLevel(lv);
              renderProps();
              renderEditor();
            };
            reader.readAsDataURL(file);
          }
        });
      }
      const clearBtn = document.getElementById('clearImgBtn');
      if(clearBtn){
        clearBtn.addEventListener('click', ()=>{
          delete el.imageUrl;
          S.saveLevel(lv);
          renderProps();
          renderEditor();
        });
      }
    }
    document.getElementById('delElBtn').addEventListener('click',()=>{
      if(!confirm('Delete this element?')) return;
      const idx=lv.elements.findIndex(e=>e.id===el.id);
      if(idx>=0) lv.elements.splice(idx,1);
      selElId=null; S.saveLevel(lv); renderProps(); renderEditor();
    });
    // Live update X/Y on input
    document.getElementById('propX').addEventListener('input',e=>{
      el.x=parseInt(e.target.value)||el.x; renderEditor();
    });
    document.getElementById('propY').addEventListener('input',e=>{
      el.y=parseInt(e.target.value)||0; renderEditor();
    });
  }
}

function renderProfiles(){
  const body = document.getElementById('profilesBody');
  const profs = S.getProfiles();
  const activePlayer = S.get('muskan_player', null);
  const activeId = activePlayer?.playerId;

  let html = `
    <div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
      <div class="prop-title" style="margin:0">User Profiles (${profs.length})</div>
      <button class="save-btn" id="openAddProfBtn" style="width:auto;padding:5px 10px;margin:0;font-size:9px">+ New Profile</button>
    </div>
  `;

  if(!profs.length){
    html += '<div class="ibx-empty">No user profiles created yet.</div>';
  } else {
    html += profs.map(p => {
      const isActive = p.playerId === activeId;
      const memCount = (p.savedMemories || []).length;
      const readCount = (p.messagesRead || []).length;
      const lvlObj = levels.find(l => l.id === p.currentLevelId);
      const lvlTitle = lvlObj ? lvlObj.title : (p.currentLevelId || 'level1');

      return `
        <div style="border:1px solid ${isActive?'var(--accent)':'var(--border)'};background:${isActive?'rgba(139,111,245,0.08)':'rgba(255,255,255,0.02)'};border-radius:4px;padding:12px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-weight:600;color:var(--text);font-size:13px;display:flex;align-items:center;gap:6px">
              <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.color}"></span>
              ${esc(p.name || p.playerId)}
              ${p.password ? '<span title="Password protected" style="font-size:11px;opacity:0.6">🔒</span>' : ''}
            </div>
            ${isActive ? '<span style="font-size:8px;background:var(--accent);color:#fff;border-radius:2px;padding:1px 5px;text-transform:uppercase">Active</span>' : ''}
          </div>
          <div style="font-size:10px;color:var(--muted);line-height:1.6;margin-bottom:8px">
            Shape: <b>${p.shape}</b> | Current Level: <b>${esc(lvlTitle)}</b><br>
            Bookmarked Memories: <b>${memCount}</b> | Notes Read: <b>${readCount}</b>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${!isActive ? `<button class="save-btn set-active-prof" data-id="${p.playerId}" style="flex:1;padding:5px;font-size:9px;margin:0">Set Active</button>` : ''}
            <button class="save-btn edit-prof-btn" data-id="${p.playerId}" style="flex:1;padding:5px;font-size:9px;margin:0;background:rgba(200,169,110,0.08);border-color:rgba(200,169,110,0.3);color:var(--accent2)">✏ Edit</button>
            <button class="del-btn reset-prof-btn" data-id="${p.playerId}" style="flex:1;padding:5px;font-size:9px;margin:0;color:var(--accent2);border-color:rgba(200,169,110,0.3)">Reset Progress</button>
            <button class="del-btn del-prof-btn" data-id="${p.playerId}" style="flex:1;padding:5px;font-size:9px;margin:0">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  body.innerHTML = html;

  document.getElementById('openAddProfBtn')?.addEventListener('click', ()=>{
    document.getElementById('addProfileModal').classList.add('active');
  });

  body.querySelectorAll('.edit-prof-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.id;
      const target = profs.find(p => p.playerId === pid);
      if(!target) return;
      document.getElementById('editProfId').value = pid;
      document.getElementById('editProfName').value = target.name || '';
      document.getElementById('editProfShape').value = target.shape || 'circle';
      document.getElementById('editProfColor').value = target.color || '#c8a96e';
      document.getElementById('editProfPass').value = '';
      document.getElementById('editProfPassConfirm').value = '';
      document.getElementById('editProfPassMsg').style.display = 'none';
      document.getElementById('editProfileModal').classList.add('active');
    });
  });

  body.querySelectorAll('.set-active-prof').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.id;
      const target = profs.find(p => p.playerId === pid);
      if(target){
        S.setActiveProfile(target);
        showToast(`Active profile set to "${target.name || target.playerId}" ✓`);
        renderProfiles();
      }
    });
  });

  body.querySelectorAll('.reset-prof-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.id;
      const target = profs.find(p => p.playerId === pid);
      if(target && confirm(`Reset progress for profile "${target.name || pid}"?`)){
        target.currentLevelId = 'level1';
        target.highestLevelIndex = 0;
        target.lastPositionX = 200;
        target.messagesRead = [];
        target.savedMemories = [];
        S.saveProfiles(profs);
        if(pid === activeId) S.setActiveProfile(target);
        showToast('Progress reset ✓');
        renderProfiles();
      }
    });
  });

  body.querySelectorAll('.del-prof-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.id;
      const idx = profs.findIndex(p => p.playerId === pid);
      if(idx >= 0 && confirm('Delete this profile?')){
        profs.splice(idx, 1);
        S.saveProfiles(profs);
        if(pid === activeId && profs.length > 0) S.setActiveProfile(profs[0]);
        showToast('Profile deleted ✓');
        renderProfiles();
      }
    });
  });
}

  const pass = document.getElementById('editProfPass').value;
  const passConfirm = document.getElementById('editProfPassConfirm').value;
  const msgEl = document.getElementById('editProfPassMsg');

  // Password validation
  if(pass !== passConfirm){
    msgEl.textContent = 'Passwords do not match.';
    msgEl.style.display = 'block';
    return;
  }
  if(pass && pass.length < 4){
    msgEl.textContent = 'Password must be at least 4 characters.';
    msgEl.style.display = 'block';
    return;
  }
  msgEl.style.display = 'none';

  const profs = S.getProfiles();
  const target = profs.find(p => p.playerId === pid);
  if(!target) return;

  target.name = name || target.name;
  target.shape = shape;
  target.color = color;
  if(pass) target.password = pass;
  else if(pass === '') delete target.password; // blank = remove password

  S.saveProfiles(profs);
  // If editing active profile, sync it
  const activePlayer = S.get('muskan_player', null);
  if(activePlayer && activePlayer.playerId === pid){
    Object.assign(activePlayer, { name: target.name, shape: target.shape, color: target.color });
    S.set('muskan_player', activePlayer);
  }
  document.getElementById('editProfileModal').classList.remove('active');
  showToast(`Profile "${target.name}" updated ✓`);
  renderProfiles();
});

// ════════════════════════════════════════════════════════════
// ONBOARDING
// ════════════════════════════════════════════════════════════
let onboardingData = [];
let activeObSeqId = null;

function renderOnboarding(){
  const body = document.getElementById('onboardingBody');
  onboardingData = S.get('muskan_onboarding', []);

  let html = `
    <div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
      <div class="prop-title" style="margin:0">Onboarding Sequences</div>
      <button class="save-btn" id="openAddObSeqBtn" style="width:auto;padding:5px 10px;margin:0;font-size:9px">+ New Sequence</button>
    </div>
  `;

  if(!onboardingData.length){
    html += '<div class="ob-empty">No onboarding sequences yet. Create one to guide your players.</div>';
    body.innerHTML = html;
    document.getElementById('openAddObSeqBtn').addEventListener('click', () => {
      document.getElementById('addObSeqModal').classList.add('active');
      document.getElementById('newObSeqName').value = '';
      populateObSeqLvlDropdown();
    });
    return;
  }

  // Sequences list
  html += '<div style="margin-bottom:20px">';
  onboardingData.forEach(seq => {
    const isActive = seq.id === activeObSeqId;
    const slidesCount = (seq.slides || []).length;
    let badgeClass = seq.trigger === 'before_level' ? 'before' : (seq.trigger === 'after_level' ? 'after' : '');
    let triggerText = seq.trigger.replace('_', ' ').toUpperCase();
    if (seq.trigger !== 'start_game' && seq.targetLevel) {
       const lvl = levels.find(l=>l.id === seq.targetLevel);
       triggerText += ': ' + (lvl ? lvl.title : seq.targetLevel);
    }
    
    html += `
      <div class="ob-seq-card ${isActive ? 'active' : ''}" data-id="${seq.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="ob-seq-title">${esc(seq.name)}</div>
            <div class="ob-seq-meta">${slidesCount} slide${slidesCount!==1?'s':''}</div>
          </div>
          <span class="ob-trigger-badge ${badgeClass}">${triggerText}</span>
        </div>
      </div>
    `;
  });
  html += '</div>';

  // Active sequence editor
  if (activeObSeqId) {
    const activeSeq = onboardingData.find(s => s.id === activeObSeqId);
    if (activeSeq) {
      html += `
        <div style="padding-top:16px;border-top:1px solid rgba(255,255,255,0.05)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div class="prop-title" style="margin:0">Slides: ${esc(activeSeq.name)}</div>
            <div style="display:flex;gap:8px">
              <button class="save-btn" id="previewObSeqBtn" style="width:auto;padding:3px 8px;font-size:9px;margin:0">Preview Seq</button>
              <button class="del-btn" id="delObSeqBtn" style="width:auto;padding:3px 8px;font-size:9px;margin:0">Delete Seq</button>
            </div>
          </div>
      `;
      
      const slides = activeSeq.slides || [];
      if (!slides.length) {
        html += '<div style="font-size:10px;color:var(--muted);text-align:center;padding:10px">No slides added yet.</div>';
      } else {
        slides.forEach((slide, idx) => {
          html += `
            <div class="ob-slide-card">
              <div class="ob-slide-num">${idx + 1}</div>
              <div class="ob-slide-info">
                <div class="ob-slide-title">${esc(slide.text) || '(Image only)'}</div>
                ${slide.image ? '<div class="ob-slide-sub">Has image attachment</div>' : ''}
              </div>
              <div class="ob-slide-actions">
                <button class="save-btn edit-slide-btn" data-idx="${idx}" style="padding:4px 6px;margin:0;font-size:9px;min-width:0;width:auto">Edit</button>
                <button class="del-btn del-slide-btn" data-idx="${idx}" style="padding:4px 6px;margin:0;font-size:9px;min-width:0;width:auto">✕</button>
              </div>
            </div>
          `;
        });
      }
      
      html += `
          <button class="ob-add-slide" id="addObSlideBtn">+ Add Slide</button>
        </div>
      `;
    }
  }

  body.innerHTML = html;

  // Bind Listeners
  document.getElementById('openAddObSeqBtn').addEventListener('click', () => {
    document.getElementById('addObSeqModal').classList.add('active');
    document.getElementById('newObSeqName').value = '';
    populateObSeqLvlDropdown();
  });

  document.querySelectorAll('.ob-seq-card').forEach(card => {
    card.addEventListener('click', () => {
      activeObSeqId = card.dataset.id;
      renderOnboarding();
    });
  });

  if (activeObSeqId) {
    const activeSeq = onboardingData.find(s => s.id === activeObSeqId);
    if(activeSeq){
      document.getElementById('delObSeqBtn')?.addEventListener('click', () => {
        if(confirm('Delete this onboarding sequence entirely?')){
          onboardingData = onboardingData.filter(s => s.id !== activeObSeqId);
          activeObSeqId = null;
          S.set('muskan_onboarding', onboardingData);
          renderOnboarding();
        }
      });
      
      document.getElementById('previewObSeqBtn')?.addEventListener('click', () => {
        if (!activeSeq.slides || !activeSeq.slides.length) {
          showToast('No slides to preview.');
          return;
        }
        startPreviewObSeq(activeSeq);
      });
      
      document.getElementById('addObSlideBtn')?.addEventListener('click', () => {
        openSlideEditor(null); // null means new slide
      });
      
      document.querySelectorAll('.edit-slide-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openSlideEditor(parseInt(btn.dataset.idx));
        });
      });
      
      document.querySelectorAll('.del-slide-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if(confirm('Delete this slide?')){
            activeSeq.slides.splice(parseInt(btn.dataset.idx), 1);
            S.set('muskan_onboarding', onboardingData);
            renderOnboarding();
          }
        });
      });
    }
  }
}

let editingSlideIdx = null;

function populateObSeqLvlDropdown() {
  const sel = document.getElementById('newObSeqLvl');
  sel.innerHTML = levels.map(l => `<option value="${l.id}">${esc(l.title)}</option>`).join('');
}

document.getElementById('newObSeqTrigger').addEventListener('change', (e) => {
  document.getElementById('newObSeqLvlRow').style.display = e.target.value === 'start_game' ? 'none' : 'flex';
});

document.getElementById('obSeqCancelBtn').addEventListener('click', () => {
  document.getElementById('addObSeqModal').classList.remove('active');
});

document.getElementById('obSeqSaveBtn').addEventListener('click', () => {
  const name = document.getElementById('newObSeqName').value.trim() || 'Untitled Sequence';
  const trigger = document.getElementById('newObSeqTrigger').value;
  const targetLevel = document.getElementById('newObSeqLvl').value;
  
  const newSeq = {
    id: 'ob_' + Date.now(),
    name,
    trigger,
    targetLevel: trigger !== 'start_game' ? targetLevel : null,
    slides: []
  };
  
  onboardingData.push(newSeq);
  S.set('muskan_onboarding', onboardingData);
  activeObSeqId = newSeq.id;
  
  document.getElementById('addObSeqModal').classList.remove('active');
  renderOnboarding();
});

// Slide Editor Actions
function openSlideEditor(idx) {
  editingSlideIdx = idx;
  const activeSeq = onboardingData.find(s => s.id === activeObSeqId);
  if (!activeSeq) return;
  
  const slide = idx !== null && activeSeq.slides[idx] ? activeSeq.slides[idx] : { text: '', image: null };
  
  document.getElementById('obSlideText').value = slide.text || '';
  document.getElementById('obSlideImgFile').value = ''; // clear file input
  const previewContainer = document.getElementById('obSlideImgPreviewContainer');
  const preview = document.getElementById('obSlideImgPreview');
  
  if (slide.image) {
    preview.src = slide.image;
    previewContainer.style.display = 'block';
  } else {
    preview.src = '';
    previewContainer.style.display = 'none';
  }
  
  document.getElementById('editObSlideModal').classList.add('active');
}

document.getElementById('obSlideImgFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(evt){
      document.getElementById('obSlideImgPreview').src = evt.target.result;
      document.getElementById('obSlideImgPreviewContainer').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

document.getElementById('obSlideImgClear').addEventListener('click', () => {
  document.getElementById('obSlideImgFile').value = '';
  document.getElementById('obSlideImgPreview').src = '';
  document.getElementById('obSlideImgPreviewContainer').style.display = 'none';
});

document.getElementById('obSlideCancelBtn').addEventListener('click', () => {
  document.getElementById('editObSlideModal').classList.remove('active');
});

document.getElementById('obSlideSaveBtn').addEventListener('click', () => {
  const activeSeq = onboardingData.find(s => s.id === activeObSeqId);
  if (!activeSeq) return;
  
  const text = document.getElementById('obSlideText').value.trim();
  const image = document.getElementById('obSlideImgPreview').src;
  
  const slideData = {
    text: text,
    image: image.startsWith('data:') ? image : null
  };
  
  if (editingSlideIdx !== null) {
    activeSeq.slides[editingSlideIdx] = slideData;
  } else {
    activeSeq.slides.push(slideData);
  }
  
  S.set('muskan_onboarding', onboardingData);
  document.getElementById('editObSlideModal').classList.remove('active');
  renderOnboarding();
});
// ════════════════════════════════════════════════════════════
async function renderInbox(){
  const msgs=await S.getMsgs();
  const body=document.getElementById('inboxBody');
  const playerMsgs=msgs.filter(m=>m.fromPlayer);

  if(!playerMsgs.length){
    body.innerHTML='<div class="ibx-empty">No player notes yet.<br>Players can leave notes from the pause menu.</div>';
    return;
  }

  const unread=playerMsgs.filter(m=>!m.isRead).length;
  document.getElementById('inboxBadge').style.display=unread?'inline':'none';
  document.getElementById('inboxBadge').textContent=unread;

  body.innerHTML=playerMsgs.map(m=>`
    <div class="ibx-item" data-id="${m.messageId}">
      <div class="ibx-item-from">
        ${m.levelId} — ${new Date(m.timestamp).toLocaleDateString()}
        ${!m.isRead?'<span class="ibx-new-badge">unread</span>':''}
        <button class="mark-btn" data-mid="${m.messageId}">${m.isRead?'Mark unread':'Mark read'}</button>
      </div>
      <div class="ibx-item-body">${esc(m.content)}</div>
      <div class="ibx-item-meta">Player: ${m.playerId||'anonymous'}</div>
      <textarea class="reply-area" placeholder="Reply to this note…" data-mid="${m.messageId}"></textarea>
      <button class="reply-btn" data-mid="${m.messageId}">Send Reply</button>
    </div>
  `).join('');

  // Reply buttons
  body.querySelectorAll('.reply-btn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const mid=btn.dataset.mid;
      const ta=body.querySelector(`.reply-area[data-mid="${mid}"]`);
      const txt=ta?.value.trim(); if(!txt) return;
      await S.replyMsg(mid,txt,'dashboard');
      ta.value=''; showToast('Reply sent ✓');
      renderInbox();
    });
  });

  // Mark read/unread
  body.querySelectorAll('.mark-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.markRead(btn.dataset.mid); renderInbox(); });
  });
}

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
let toastTimeout=null;
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('on'); clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>t.classList.remove('on'),2800);
}

// ════════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════════
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// ════════════════════════════════════════════════════════════
// ONBOARDING PREVIEW
// ════════════════════════════════════════════════════════════
let previewObSeq = null;
let previewObIdx = 0;

function startPreviewObSeq(seq) {
  previewObSeq = seq;
  previewObIdx = 0;
  document.getElementById('previewObOverlay').classList.add('active');
  renderPreviewObSlide();
}

function renderPreviewObSlide() {
  if (!previewObSeq || !previewObSeq.slides) return;
  const slide = previewObSeq.slides[previewObIdx];
  
  document.getElementById('prevObText').textContent = slide.text || '';
  const imgCont = document.getElementById('prevObImgCont');
  const img = document.getElementById('prevObImg');
  
  if (slide.image) {
    img.src = slide.image;
    imgCont.style.display = 'block';
  } else {
    img.src = '';
    imgCont.style.display = 'none';
  }
  
  document.getElementById('prevObPrevBtn').style.display = previewObIdx > 0 ? 'inline-flex' : 'none';
  document.getElementById('prevObNextBtn').textContent = previewObIdx === previewObSeq.slides.length - 1 ? 'Close Preview' : 'Next →';
}

document.getElementById('prevObPrevBtn').addEventListener('click', () => {
  if (previewObIdx > 0) {
    previewObIdx--;
    renderPreviewObSlide();
  }
});

document.getElementById('prevObNextBtn').addEventListener('click', () => {
  if (previewObIdx < previewObSeq.slides.length - 1) {
    previewObIdx++;
    renderPreviewObSlide();
  } else {
    document.getElementById('previewObOverlay').classList.remove('active');
  }
});

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
async function init(){
  const remote=await S.getLevels();
  levels=remote||DEFAULT_LEVELS;

  // Check for unread inbox messages
  const msgs=S.get('muskan_messages',[]);
  const unread=msgs.filter(m=>m.fromPlayer&&!m.isRead).length;
  if(unread){ document.getElementById('inboxBadge').style.display='inline'; document.getElementById('inboxBadge').textContent=unread; }

  renderLevelList();

  // Auto-select first level
  if(levels.length>0){ selectLevel(levels[0].id); }
  else { renderProps(); renderEditor(); }
}

init();
